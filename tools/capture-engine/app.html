<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹사이트 스냅샷</title>
<style>
  :root { --ink: #111; --mute: #6b6b70; --line: #e3e3e6; --bg: #f6f6f7; --card: #fff; --ok: #0a7d3c; --warn: #a06000; --bad: #b3261e; --accent: #1a56db; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
  .step[hidden] { display: none; }
  .step h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  .step h2 .n { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13px; align-items: center; justify-content: center; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=url] { flex: 1; min-width: 320px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .mute { color: var(--mute); font-size: 13px; }
  .tree { font-size: 14px; }
  .tree label { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .tree .d1 { padding-left: 28px; } .tree .d2 { padding-left: 56px; } .tree .d3 { padding-left: 84px; }
  .tree .path { color: var(--mute); font-size: 12px; margin-left: 4px; }
  .tree .skip { color: var(--mute); }
  .tree .skip .why { font-size: 12px; margin-left: 6px; }
  .sections { margin-top: 12px; font-size: 13px; color: var(--mute); }
  .sections summary { cursor: pointer; }
  .sections li { margin: 2px 0; }
  .opts { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .opts .w { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
  .opts .w:has(input:checked) { border-color: var(--accent); background: #eef3ff; }
  .log { background: #111; color: #ddd; font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 12px; border-radius: 8px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .card .t { height: 200px; overflow: hidden; background: #eee; }
  .card .t img { width: 100%; display: block; }
  .card .b { padding: 10px 12px; font-size: 13px; }
  .card .b b { display: block; font-weight: 600; margin-bottom: 2px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #eee; }
  .badge.ok { background: #e2f5e9; color: var(--ok); } .badge.warn { background: #fff1d6; color: var(--warn); } .badge.bad { background: #fde3e1; color: var(--bad); }
  .card.pending .t { display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 13px; }
  .err { color: var(--bad); }
  .done-links { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  code { background: #eee; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  .busy { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: var(--mute); font-size: 13px; }
  .busy .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%, 100% { transform: scale(.6); opacity: .4 } 50% { transform: scale(1); opacity: 1 } }
  .busy .txt { min-width: 0; }
  .busy .t { color: #999; }
  .card .act { font-size: 12px; color: var(--accent); margin-top: 4px; min-height: 16px; }
  .card .retake { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
  .card .retake textarea { width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; min-height: 52px; }
  .card .retake .r { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .card .retake .rt { width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
  .card .retake .rt svg { width: 18px; height: 18px; }
  .card .retake .rt:hover svg { transform: rotate(-60deg); transition: transform .3s; }
  .card .sel { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; accent-color: var(--accent); }
  .card { position: relative; }
  .export { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fafafa; }
  .export .grow { flex: 1 1 auto; }
  .export .f { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); }
  .export .f input { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .export .f input.nm { width: 220px; } .export .f input.dir { width: 320px; }
  .export .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .export .msg { flex-basis: 100%; }
  .export .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .export .seg label { padding: 7px 12px; cursor: pointer; font-size: 14px; }
  .export .seg label:has(input:checked) { background: var(--accent); color: #fff; }
  .export .seg input { display: none; }
  .export .msg { font-size: 13px; color: var(--mute); }
  .card .applied { font-size: 12px; color: var(--ok); }
  .card .ignored { font-size: 12px; color: var(--warn); }
  .card .prev { font-size: 12px; color: var(--mute); }
</style>
<main>
  <h1>웹사이트 스냅샷</h1>

  <section class="step" id="s1">
    <h2><span class="n">1</span>주소</h2>
    <form class="row" id="f1">
      <input type="url" id="url" placeholder="https://example.com/" required autofocus>
      <button class="primary" id="b1" type="submit">분석하기</button>
    </form>
    <div class="busy" id="busy1"></div>
    <p class="mute" id="m1"></p>
  </section>

  <section class="step" id="s2" hidden>
    <h2><span class="n">2</span>정보구조 — 찍을 페이지 고르기</h2>
    <p class="mute" id="m2"></p>
    <div class="row" style="margin-bottom:8px">
      <button id="all">전체 선택</button>
      <button id="none">전체 해제</button>
      <span class="mute" id="count"></span>
    </div>
    <div class="tree" id="tree"></div>
    <details class="sections" id="sections"></details>
  </section>

  <section class="step" id="s3" hidden>
    <h2><span class="n">3</span>화면 크기</h2>
    <div class="opts">
      <label class="w"><input type="radio" name="w" value="1440"> 데스크탑 1440</label>
      <label class="w"><input type="radio" name="w" value="1920" checked> 데스크탑 1920</label>
      <label class="w"><input type="radio" name="w" value="375"> 모바일 375</label>
      <label><input type="checkbox" id="check" checked> 두 번 찍어 검사 <span class="mute">(느리지만 움직이는 것을 잡아냅니다)</span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="b3">캡처 시작</button>
      <span class="mute" id="m3"></span>
    </div>
  </section>

  <section class="step" id="s4" hidden>
    <h2><span class="n">4</span>스크린샷</h2>
    <p class="mute" id="m4"></p>
    <div class="log" id="log"></div>
    <div class="grid" id="grid"></div>
    <div class="export" id="export" hidden>
      <span class="seg"><label><input type="radio" name="fmt" value="img" checked>IMG</label><label><input type="radio" name="fmt" value="pdf">PDF</label></span>
      <span class="right">
        <button id="selToggle">전체 해제</button>
        <span class="mute" id="selCount"></span>
        <button class="primary" id="exportBtn">출력하기</button>
      </span>
      <span class="msg" id="exportMsg"></span>
    </div>
  </section>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let analysis = null;

  async function api(path, body) {
    const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
    return r.json();
  }

  /* ── 기다리는 동안: 서버가 지금 무엇을 하는지 + 그 사이를 채우는 문구 ── */
  const FILLERS = [
    '페이지를 열어 보고 있어요 ☕', '움직이는 게 멈추길 잠깐 기다리는 중이에요', '맨 위 메뉴 줄을 찾고 있어요',
    '메뉴에 하나씩 마우스를 올려 보는 중이에요', '드롭다운이 열리나 살펴보고 있어요', '진짜 메뉴인지 한 번 더 확인하고 있어요',
    '언어 선택 버튼은 따로 빼 둘게요', '페이지를 위에서 아래로 쭉 훑어보는 중이에요', '어떤 구간이 어떻게 짜였는지 보고 있어요',
    '히어로, 카드, 갤러리, 폼을 나누고 있어요', '헤더와 푸터 링크를 정리하고 있어요', '거의 다 됐어요, 조금만요!',
  ];
  // 서버 문구도 같은 말투로
  const friendly = (t) => t
    .replace(/^여는 중$/, '페이지를 열어 보고 있어요')
    .replace(/^메뉴에 마우스 올려 확인 — (.+)$/, '"$1" 메뉴에 마우스를 올려 보는 중이에요')
    .replace(/^메인페이지 구성 읽는 중$/, '메인페이지가 어떻게 짜였는지 보고 있어요')
    .replace(/^브라우저를 띄우는 중$/, '브라우저를 켜고 있어요');
  let busyTimer = null;
  function startBusy(el, statusUrl) {
    const t0 = Date.now(); let i = 0; let last = '';
    el.innerHTML = `<span class="dot"></span><span class="txt"></span>`;
    const txt = el.querySelector('.txt');
    let sinceLive = 0;
    const tick = async () => {
      let live = '';
      if (statusUrl) { try { const s = await api(statusUrl); live = s.text || ''; } catch { /* 무시 */ } }
      // 서버가 새 말을 하면 그대로, 같은 말이 4번 넘게 이어지면 사이를 채우는 문구로
      if (live && live !== last) { last = live; sinceLive = 0; txt.textContent = friendly(live); }
      else if (!live || ++sinceLive > 4) { txt.textContent = FILLERS[i++ % FILLERS.length]; sinceLive = 0; }
    };
    tick();
    busyTimer = setInterval(tick, 900);
  }
  function stopBusy(el) { clearInterval(busyTimer); busyTimer = null; el.innerHTML = ''; }

  /* ── 1. 분석 ── */
  $('#f1').addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = $('#url').value.trim();
    $('#b1').disabled = true;
    $('#m1').textContent = '';
    ['#s2', '#s3', '#s4'].forEach((s) => { $(s).hidden = true; });
    startBusy($('#busy1'), '/api/status');
    try {
      const r = await api('/api/sitemap', { url });
      stopBusy($('#busy1'));
      if (!r.ok) { $('#m1').innerHTML = `<span class="err">실패: ${esc(r.error)}</span>`; return; }
      analysis = r;
      $('#m1').textContent = `${r.title || ''} — 메뉴 ${r.menuCount}개, 찍을 수 있는 페이지 ${r.pages.length}개`;
      renderTree(r);
      $('#s2').hidden = false; $('#s3').hidden = false;
      $('#s2').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } finally { stopBusy($('#busy1')); $('#b1').disabled = false; }
  });

  function renderTree(r) {
    const pageByUrl = new Map(r.pages.map((p) => [norm(p.url), p]));
    const rows = [];
    // 홈은 항상 맨 위
    rows.push(`<label class="d0"><input type="checkbox" class="pg" data-url="${esc(r.pages[0].url)}" data-label="홈" checked> 홈 <span class="path">${esc(shortUrl(r.pages[0].url))}</span></label>`);
    const seen = new Set([norm(r.pages[0].url)]);
    const walk = (items, depth, path) => {
      for (const it of items) {
        const p = [...path, it.label];
        const k = norm(it.href);
        const capturable = (it.kind === '페이지' || it.home) && it.href;
        if (capturable && !seen.has(k)) {
          seen.add(k);
          rows.push(`<label class="d${Math.min(depth, 3)}"><input type="checkbox" class="pg" data-url="${esc(it.href)}" data-label="${esc(p.join(' > '))}" checked> ${esc(it.label)} <span class="path">${esc(shortUrl(it.href))}</span></label>`);
        } else {
          const why = !it.href ? '눌러야 열림' : seen.has(k) ? '위와 같은 페이지' : it.kind === '외부' ? '외부 링크' : it.kind === '앵커' ? '페이지 안 위치' : it.kind === '파일' ? '파일' : it.kind;
          rows.push(`<div class="d${Math.min(depth, 3)} skip">${esc(it.label)}<span class="why">(${esc(why)} — 캡처 대상 아님)</span></div>`);
        }
        walk(it.children || [], depth + 1, p);
      }
    };
    walk(r.menu, 0, []);
    $('#tree').innerHTML = rows.join('');
    $('#m2').textContent = (r.languages && r.languages.length ? `언어 선택(${r.languages.join(', ')})은 정보구조에서 뺐습니다. ` : '') + '체크한 페이지만 찍습니다.';
    const sec = (r.main && r.main.sections) || [];
    $('#sections').innerHTML = sec.length
      ? `<summary>메인페이지 구성 — ${sec.length}개 구간 (문서 ${r.main.docHeight.toLocaleString('en-US')}px)</summary><ol>${sec.map((s) => `<li><b>${esc(s.type)}</b> ${esc(s.heading || s.text.slice(0, 40))}${s.gnb ? ' ← GNB 항목' : ''}${s.parts.length ? ` <span>(${esc(s.parts.join(' · '))})</span>` : ''}</li>`).join('')}</ol>`
      : '<summary>메인페이지 구성 — 구간을 못 나눴습니다</summary>';
    updateCount();
    $('#tree').addEventListener('change', updateCount);
  }
  const norm = (h) => { try { const u = new URL(h); u.hash = ''; return u.href.replace(/\/$/, ''); } catch { return h || ''; } };
  const shortUrl = (h) => { try { const u = new URL(h); return (u.pathname + u.search) || '/'; } catch { return h; } };
  const selected = () => [...document.querySelectorAll('.pg:checked')].map((c) => ({ url: c.dataset.url, path: c.dataset.label.split(' > ') }));
  function updateCount() { const n = selected().length; $('#count').textContent = `${n}개 선택`; $('#b3').disabled = n === 0; $('#b3').textContent = `${n}개 페이지 캡처 시작`; }
  $('#all').onclick = () => { document.querySelectorAll('.pg').forEach((c) => { c.checked = true; }); updateCount(); };
  $('#none').onclick = () => { document.querySelectorAll('.pg').forEach((c) => { c.checked = false; }); updateCount(); };

  /* ── 3·4. 캡처 ── */
  let timer = null;
  $('#b3').addEventListener('click', async () => {
    const pages = selected();
    const width = Number(document.querySelector('input[name=w]:checked').value);
    const check = $('#check').checked;
    $('#b3').disabled = true;
    $('#m3').textContent = '';
    const r = await api('/api/capture', { pages, width, check });
    if (!r.ok) { $('#m3').innerHTML = `<span class="err">${esc(r.error)}</span>`; $('#b3').disabled = false; return; }
    $('#s4').hidden = false;
    $('#grid').innerHTML = pages.map((p) => `<div class="card pending" data-url="${esc(norm(p.url))}"><div class="t">기다리는 중</div><div class="b"><b>${esc(p.path.join(' > '))}</b><span class="mute">${esc(shortUrl(p.url))}</span><div class="act"></div></div></div>`).join('');
    $('#m4').textContent = `저장 위치: ${r.outDir}`;
    $('#s4').scrollIntoView({ behavior: 'smooth', block: 'start' });
    clearInterval(timer);
    timer = setInterval(() => poll(r.id), 1500);
    poll(r.id);
  });

  const fileUrl = (id, f) => `/files/${encodeURIComponent(id)}/${encodeURIComponent(f)}`;
  function renderCard(card, row, id) {
    const cls = row.status === '확인됨' ? 'ok' : row.status === '검수 필요' ? 'warn' : 'bad';
    const file = row.files && row.files[0] ? fileUrl(id, row.files[0]) : null;
    card.innerHTML = `${file ? `<input type="checkbox" class="sel" title="출력에 넣기" checked>` : ''}<div class="t">${file ? `<a href="${file}" target="_blank"><img src="${file}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'err',style:'padding:12px;font-size:12px',textContent:'그림을 못 불러왔어요: ' + decodeURIComponent(this.src.split('/').pop())}))"></a>` : `<div class="err" style="padding:12px">${esc(row.error || '이미지 없음')}</div>`}</div>
      <div class="b"><b>${esc(row.path || row.name)}</b><span class="badge ${cls}">${esc(row.status)}</span>
      ${row.docHeight ? ` <span class="mute">${row.docHeight.toLocaleString('en-US')}px</span>` : ''}
      ${row.retakes ? ` <span class="mute">· ${row.retakes}번째 다시 찍음</span>` : ''}
      ${row.gaps && row.gaps.length ? `<div class="mute">${esc(row.gaps.join(' · '))}</div>` : ''}
      ${row.diffFile ? `<div><a href="${fileUrl(id, row.diffFile)}" target="_blank">무엇이 달랐는지 보기</a></div>` : ''}
      ${(row.notes || []).filter((n) => /헤더|잘라/.test(n)).map((n) => `<div class="mute">${esc(n)}</div>`).join('')}
      ${row.pieceFiles && row.pieceFiles.length ? `<div class="mute">조각: ${row.pieceFiles.map((f, i) => `<a href="${fileUrl(id, f)}" target="_blank">${i + 1}</a>`).join(' · ')}</div>` : ''}
      ${row.previous && row.previous.length ? `<div class="prev">이전: ${row.previous.map((f) => `<a href="${fileUrl(id, f)}" target="_blank">${esc(f)}</a>`).join(', ')}</div>` : ''}
      <div class="retake">
        <div class="r"><button class="rt" title="다시 찍기" aria-label="다시 찍기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></svg></button><span class="mute">다시 찍기</span></div>
      </div></div>`;
    card.querySelector('.rt').onclick = async () => {
      const r = await api('/api/retake', { id, url: row.url, request: '' });
      if (!r.ok) { alert(r.error); return; }
      card.classList.add('pending');
      card.dataset.stamp = '';
      card.querySelector('.t').innerHTML = '다시 찍는 중';
      if (!timer) timer = setInterval(() => poll(id), 1500);
    };
  }

  /* ── 내보내기 ── */
  let currentJob = null;
  const allSel = () => [...document.querySelectorAll('.card .sel')];
  const selCards = () => allSel().filter((c) => c.checked).map((c) => c.closest('.card').dataset.url);
  function updateSel() {
    const n = selCards().length, t = allSel().length;
    $('#selCount').textContent = `${n}/${t}개`;
    $('#selToggle').textContent = n === t && t > 0 ? '전체 해제' : '전체 선택';
    $('#exportBtn').disabled = n === 0;
  }
  document.addEventListener('change', (e) => { if (e.target.classList.contains('sel')) updateSel(); });
  $('#selToggle').onclick = () => { const on = $('#selToggle').textContent === '전체 선택'; allSel().forEach((c) => { c.checked = on; }); updateSel(); };
  async function doExport() {
    const format = document.querySelector('input[name=fmt]:checked').value;
    const urls = selCards();
    if (!urls.length) { $('#exportMsg').textContent = '카드 왼쪽 위 체크박스로 먼저 골라 주세요'; return; }
    // 맥의 "별도 저장" 창으로 이름과 위치를 받는다. 창은 앱을 띄운 터미널 쪽에 뜬다.
    $('#exportMsg').textContent = '저장 창에서 이름과 위치를 정해 주세요…';
    $('#exportBtn').disabled = true;
    let dir = '', name = '';
    try {
      const pick = await api('/api/pickSave', { id: currentJob, format });
      if (!pick.ok) { $('#exportMsg').innerHTML = `<span class="err">${esc(pick.error)}</span>`; return; }
      if (pick.cancelled) { $('#exportMsg').textContent = '취소했어요'; return; }
      if (pick.native) {
        const path = pick.path.replace(/\/$/, '');
        const i = path.lastIndexOf('/');
        dir = path.slice(0, i); name = path.slice(i + 1).replace(/\.pdf$/i, '');
      }
    } finally { $('#exportBtn').disabled = false; }
    $('#exportMsg').textContent = format === 'pdf' ? 'PDF 한 권으로 묶고 있어요…' : '폴더에 담고 있어요…';
    const r = await api('/api/export', { id: currentJob, urls, format, dir, name });
    if (!r.ok) { $('#exportMsg').innerHTML = `<span class="err">${esc(r.error)}</span>`; return; }
    if (r.download) {
      // 서버에 올려 쓰는 경우: 브라우저 내려받기 — 브라우저의 저장 창이 뜬다
      $('#exportMsg').textContent = format === 'pdf' ? `PDF ${r.pages}쪽을 내려받아요` : `${r.count}장을 zip 으로 내려받아요 (풀면 폴더가 돼요)`;
      window.location.href = r.download;
      return;
    }
    $('#exportMsg').innerHTML = format === 'pdf'
      ? `PDF ${r.pages}쪽으로 묶었어요 → <code>${esc(r.path)}</code>`
      : `${r.count}장을 폴더에 담았어요 → <code>${esc(r.path)}</code>`;
  }
  $('#exportBtn').onclick = doExport;

  async function poll(id) {
    const j = await api(`/api/job?id=${encodeURIComponent(id)}`);
    if (!j.ok) return;
    $('#log').textContent = j.log.slice(-40).join('\n');
    $('#log').scrollTop = $('#log').scrollHeight;
    // 기다리는 카드에는 지금 무엇을 하는지
    for (const card of document.querySelectorAll('.card.pending')) {
      const a = j.activity && j.activity[card.dataset.url];
      const act = card.querySelector('.act');
      if (act) act.textContent = a || '';
      if (a) card.querySelector('.t').textContent = '찍는 중';
    }
    for (const row of j.rows) {
      const card = document.querySelector(`.card[data-url="${CSS.escape(norm(row.url))}"]`);
      if (!card) continue;
      const stamp = `${row.status}|${(row.files || []).join(',')}|${row.retakes || 0}`;
      if (card.dataset.stamp === stamp) continue;
      card.dataset.stamp = stamp;
      card.classList.remove('pending');
      if (row.status === '다시 찍는 중') {
        card.classList.add('pending');
        card.querySelector('.t').innerHTML = '다시 찍는 중';
        continue;
      }
      renderCard(card, row, id);
    }
    if (j.status === '완료' || j.status === '실패') {
      clearInterval(timer); timer = null;
      $('#b3').disabled = false;
      currentJob = id;
      $('#export').hidden = !j.rows.some((r) => r.files && r.files.length);
      updateSel();
      const ok = j.rows.filter((r) => r.status === '확인됨').length;
      const warn = j.rows.filter((r) => r.status === '검수 필요').length;
      const bad = j.rows.filter((r) => r.status === '실패').length;
      const secs = Math.round(((j.finishedAt || Date.now()) - j.startedAt) / 1000);
      $('#m4').innerHTML = `${j.status} — 확인됨 ${ok} · 검수 필요 ${warn} · 실패 ${bad} · ${secs}초${j.error ? ` <span class="err">${esc(j.error)}</span>` : ''}<br>저장 위치: <code>${esc(j.outDir)}</code>`;

    }
  }
</script>
</html>
