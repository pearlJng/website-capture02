<!doctype html><meta charset=utf-8><title>화면 밖에 숨겨 둔 고정 메뉴</title>
<style>
body{margin:0;font:16px/1.6 system-ui}
/* 아임웹: 스크롤용 고정 메뉴를 top:-99999px 에 숨겨 둔다. 폭은 100%, 높이도 있다.
   "맨 위에 걸친 폭 넓은 고정 요소"를 헤더로 고르면 이것이 뽑히고, 진짜 헤더(자홍색)는
   나머지로 분류되어 첫 화면에서 숨겨진다. 자홍색이 첫 화면 위쪽에 있어야 한다. */
.ghost{position:fixed;top:-99999px;left:0;width:100%;height:80px;background:#fff;z-index:8}
header{position:fixed;top:0;left:0;width:100%;height:80px;background:#ff00aa;color:#fff;display:flex;align-items:center;padding:0 24px;font-weight:700;z-index:9}
main{padding-top:80px}
section{height:900px}
section:nth-child(odd){background:#eef}section:nth-child(even){background:#efe}
</style>
<div class="ghost">GNB (숨김)</div>
<header>GNB · About · Product · Contact</header>
<main><section>1</section><section>2</section><section>3</section><section>4</section></main>
