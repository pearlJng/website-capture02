<!doctype html><meta charset=utf-8><title>스크롤하면 그때 생기는 헤더</title>
<style>
body{margin:0;font:16px/1.6 system-ui;background:#111;color:#ddd}
/* 맨 위에서는 없다. 300px 넘게 내려가면 JS 가 그제서야 만들고, 스크롤 위치만큼 내려
   붙인다(position 은 absolute). 직전 조각과 견주는 방식으로는 **처음 나타난** 조각에서
   못 잡는다 — 링고컴퍼니 둘째 조각 위의 흰 띠. 순수한 자홍색으로 센다. */
body{position:relative}
#late{position:absolute;left:0;width:100%;height:79px;background:#ff00aa;display:none;z-index:9}
section{height:900px;border-bottom:1px solid #333}
</style>
<main><section>1</section><section>2</section><section>3</section><section>4</section><section>5</section></main>
<script>
addEventListener('scroll', () => {
  let h = document.getElementById('late');
  if (scrollY > 300) {
    if (!h) { h = document.createElement('div'); h.id = 'late'; h.textContent = 'GNB · About · Product · Contact'; document.body.appendChild(h); }
    h.style.display = 'block'; h.style.top = scrollY + 'px';
  } else if (h) { h.style.display = 'none'; }
});
</script>
