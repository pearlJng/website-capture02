<!doctype html><meta charset=utf-8><title>매 프레임 새로 그리는 헤더</title>
<style>
body{margin:0;font:16px/1.6 system-ui;position:relative}
/* 헤더를 매 프레임(rAF) 통째로 새로 만들어 스크롤 위치에 얹는다. 숨긴 직후에도
   다음 프레임에 새것이 생기므로 DOM 으로는 어떤 방법으로도 못 잡는다.
   그림을 보고 잘라내는 수밖에 없다. 순수한 자홍색으로 검사한다. */
.hd{position:absolute;left:0;width:100%;height:80px;color:#fff;display:flex;align-items:center;justify-content:center;gap:60px;font-weight:700;z-index:9;pointer-events:none}
.hd a{pointer-events:auto;background:#ff00aa;padding:8px 14px;min-width:240px;text-align:center;color:#fff;text-decoration:none}
main{padding-top:80px}
section{height:900px}
section:nth-child(odd){background:#eef}section:nth-child(even){background:#efe}
/* 첫 화면은 사진처럼 어지러운 바탕 — 첫 조각과 둘째 조각만 견주면 온 픽셀이 '내용'이라 못 잡는다 (테라클) */
section:first-child{background:repeating-linear-gradient(45deg,#345 0 3px,#9ab 3px 6px,#c96 6px 9px)}
</style>
<div class="hd" style="top:0"><a href="/a">About</a><a href="/b">Product</a><a href="/c">Service</a><a href="/d">Contact</a></div>
<main><section>1</section><section>2</section><section>3</section><section>4</section></main>
<script>
const html = document.querySelector('.hd').innerHTML;
(function tick() {
  const old = document.querySelector('.hd');
  const fresh = document.createElement('div');
  fresh.className = 'hd';
  fresh.innerHTML = html;
  fresh.style.cssText = 'top:' + scrollY + 'px';
  old.replaceWith(fresh);
  requestAnimationFrame(tick);
})();
</script>
