<!doctype html><meta charset=utf-8><title>자식이 스스로 보이겠다는 헤더</title>
<style>
body{margin:0;font:16px/1.6 system-ui}
/* 고정 헤더. 포장은 투명하고, 안의 메뉴 목록이 visibility:visible 을 스스로 정해 뒀다.
   부모를 visibility:hidden 으로 숨겨도 이 메뉴는 그대로 보인다 — 테라클 헤더가 이렇다. */
header{position:fixed;top:0;left:0;width:100%;height:80px;z-index:9}
header .logo{position:absolute;left:24px;top:24px;color:#fff;font-weight:700}
header ul{visibility:visible;list-style:none;margin:0;padding:0;position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;gap:24px}
header li a{display:block;min-width:200px;text-align:center;padding:8px 14px;background:#ff00aa;color:#fff;text-decoration:none;font-weight:700}
main{padding-top:80px}
section{height:900px}
section:nth-child(odd){background:#eef}section:nth-child(even){background:#efe}
</style>
<header><span class="logo">LOGO</span><ul><li><a href="/a">About</a></li><li><a href="/b">Product</a></li><li><a href="/c">Service</a></li><li><a href="/d">Contact</a></li></ul></header>
<main><section>1</section><section>2</section><section>3</section><section>4</section></main>
