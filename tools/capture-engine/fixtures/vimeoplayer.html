<!doctype html><meta charset=utf-8><title>비메오 배경 플레이어 흉내</title>
<style>html,body{margin:0;height:100%;background:#000}video{width:100%;height:100%;object-fit:cover;display:block}</style>
<video src="fadein.webm" muted loop playsinline preload="auto"></video>
<script>
// 플레이어는 조금 준비한 뒤 재생을 걸고, 실제로 재생되면 바깥에 'play' 를 알린다
var v = document.querySelector('video');
v.addEventListener('playing', function () { parent.postMessage({ event: 'play' }, '*'); });
setTimeout(function () { v.play().catch(function () {}); }, 800);
</script>
