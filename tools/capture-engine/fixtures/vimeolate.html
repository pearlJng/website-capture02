<!doctype html><meta charset=utf-8><title>늦게 뜨는 비메오 배경 영상 — 재생이 시작돼야 보인다 (동인써모 홈 구조)</title>
<style>
body{margin:0;font:16px/1.6 system-ui}
.hero{position:relative;height:640px;background:#cfcfcf;overflow:hidden}
/* 아임웹 비주얼 섹션: 영상 상자는 플레이어가 'play' 를 알릴 때까지 투명하다 */
.section_vg{position:absolute;inset:0;opacity:0;transition:opacity .7s}
.section_vg.active{opacity:1}
.section_vg iframe{width:100%;height:100%;border:0;display:block}
section{height:900px;padding:40px}
</style>
<div class="hero"><div class="section_vg _section_vg" id="screen_hero" data-vimeo-id="1223263186" data-vimeo-defer=""></div></div>
<section><h2>동인써모의 독자적인 냉동 기술은</h2></section>
<script>
// 문서 끝 스크립트가 조금 뒤에 플레이어를 만든다 (이미지 로딩·SDK 로딩을 기다리는 흉내)
setTimeout(function () {
  var f = document.createElement('iframe');
  f.src = '__CROSS_ORIGIN__/vimeoplayer.html';
  f.allow = 'autoplay';
  document.getElementById('screen_hero').appendChild(f);
}, 2500);
window.addEventListener('message', function (e) {
  if (e.data && e.data.event === 'play') document.getElementById('screen_hero').classList.add('active');
});
</script>
<!-- 눌러야 재생되는 일반 임베드는 기다리지 않는다 -->
<iframe src="__CROSS_ORIGIN__/clickplayer.html" style="position:absolute;top:700px;left:40px;width:480px;height:270px;border:0" data-note="no-autoplay"></iframe>
