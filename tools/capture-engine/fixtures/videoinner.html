<!doctype html><meta charset=utf-8><title>임베드 안의 비디오</title>
<style>body{margin:0;background:#000}video{width:100%;height:auto;display:block}</style>
<video src="clock.webm" autoplay muted loop playsinline></video>
<script>
// 임베드 플레이어처럼 스스로 계속 재생을 건다

</script>
