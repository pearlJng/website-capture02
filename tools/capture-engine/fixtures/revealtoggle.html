<!doctype html><meta charset=utf-8><title>화면을 벗어나면 다시 숨는 페이지</title>
<style>
body{margin:0;font:16px/1.6 system-ui}
.sec{height:700px;margin:40px;background:#48c;color:#fff;display:grid;place-items:center;
     font-size:2rem;opacity:0;transform:translateY(40px);transition:opacity .4s,transform .4s}
.sec.in{opacity:1;transform:none}
</style>
<h1 style="padding:24px">각 칸은 화면에 들어오면 나타나고, 나가면 다시 숨습니다</h1>
<div class="sec">1</div><div class="sec">2</div><div class="sec">3</div>
<div class="sec">4</div><div class="sec">5</div><div class="sec">6</div>
<script>
/*
 * 아주 흔한 등장 애니메이션 구현이다. 들어올 때 클래스를 붙이고
 * **나갈 때 뗀다.** 그래서 맨 아래까지 훑고 맨 위로 돌아온 뒤에 한 장으로
 * 찍으면, 화면 밖 칸들은 전부 다시 투명해진 상태다.
 *
 * GoFullPage 같은 확장은 이 문제가 없다 — 각 칸이 화면에 있는 동안
 * 그 화면을 찍어서 이어 붙이기 때문이다.
 */
const io = new IntersectionObserver((es) => {
  for (const e of es) e.target.classList.toggle('in', e.isIntersecting);
});
document.querySelectorAll('.sec').forEach((el) => io.observe(el));
</script>
