<!doctype html><meta charset=utf-8><title>순환형</title>
<style>
body{margin:0;font:16px/1.6 system-ui}
.blink{height:600px;animation:blink 300ms steps(2,jump-none) infinite}
@keyframes blink{0%{background:#000}100%{background:#fff}}
.spin{width:200px;height:200px;margin:40px;background:conic-gradient(#f00,#00f,#f00);
      animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<h1 style="padding:24px">계속 돌고 있는 페이지</h1>
<div class="blink"></div>
<div class="spin"></div>
<script>
/*
 * 위상을 벽시계에 건다.
 *
 * 로컬 픽스처는 로드부터 캡처까지의 시간이 밀리초 단위로 재현되기 때문에,
 * 그냥 두면 두 번 찍어도 애니메이션이 같은 각도에 걸려 "우연히 같게" 나온다.
 * 실제 사이트에서는 네트워크 편차 때문에 그런 일이 없다 — 루프는 방문자가
 * 언제 보느냐에 따라 아무 위상에나 걸려 있다. 그 상황을 재현한다.
 */
for (const el of document.querySelectorAll('.blink, .spin')) {
  el.style.animationDelay = -(Date.now() % 100000) + 'ms';
}
</script>
