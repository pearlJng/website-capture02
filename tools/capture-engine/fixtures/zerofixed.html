<!doctype html><meta charset=utf-8><title>높이 0 고정 포장 속 헤더</title>
<style>
body{margin:0;font:16px/1.6 system-ui}
/* 아임웹 고정 메뉴 방식: 포장은 position:fixed 인데 높이가 0 이고, 그 안에 absolute 로
   그린 흰 바가 스크롤하면 나타난다. 포장 크기만 보면 지나치고, 안의 바는 fixed 가 아니다.
   두 번째 조각 위에 흰 띠가 남은 원인. 순수한 자홍색으로 센다. */
.wrap{position:fixed;top:0;left:0;width:100%;height:0;z-index:9}
.bar{position:absolute;top:0;left:0;width:100%;height:77px;background:#ff00aa;display:none}
body.scrolled .bar{display:block}
section{height:900px}
section:nth-child(odd){background:#eef}section:nth-child(even){background:#efe}
</style>
<div class="wrap"><div class="bar">GNB · About · Product · Contact</div></div>
<main><section>1</section><section>2</section><section>3</section><section>4</section></main>
<script>addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 10));</script>
