<!doctype html><meta charset=utf-8><title>스크롤마다 새로 만드는 헤더</title>
<style>
body{margin:0;font:16px/1.6 system-ui;position:relative}
/* 헤더를 스크롤할 때마다 통째로 새로 만들어 스크롤 위치에 얹는다. position 은 absolute,
   요소도 매번 새것이라 "표를 붙여 두고 숨기기"가 통하지 않고, 인라인 style 도 매번 새로 쓴다.
   순수한 자홍색 — 결과에서 이 색이 어디 있는지 세어 검사한다. */
.hd{position:absolute;left:0;width:100%;height:80px;background:#ff00aa;color:#fff;display:flex;align-items:center;padding:0 24px;font-weight:700;z-index:9}
main{padding-top:80px}
section{height:900px}
section:nth-child(odd){background:#eef}section:nth-child(even){background:#efe}
</style>
<div class="hd" style="top:0">GNB · About · Product · Contact</div>
<main><section>1</section><section>2</section><section>3</section><section>4</section></main>
<script>
addEventListener('scroll', () => {
  const old = document.querySelector('.hd');
  const fresh = document.createElement('div');
  fresh.className = 'hd';
  fresh.textContent = old.textContent;
  fresh.style.cssText = 'top:' + scrollY + 'px';   // 인라인 style 을 통째로 새로 쓴다
  old.replaceWith(fresh);
});
</script>
