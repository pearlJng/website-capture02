<style>body{margin:0;font:16px/1.6 system-ui}</style>
<h1 style="padding:24px">위쪽은 항상 같고, 맨 아래만 몇 픽셀 흔들립니다</h1>
<div style="height:2000px;background:linear-gradient(#fff,#ccd)"></div>
<!--
  실측에서 코오롱몰이 15,519px 대 15,515px — 4픽셀 차이로 100% 실패 처리됐다.
  폰트 줄바꿈이나 지연 이미지 하나 때문에 문서 높이는 실행마다 조금씩 흔들린다.
  그걸 "페이지가 통째로 달라졌다"와 같은 칸에 넣으면 안 된다.

  높이는 서버가 요청마다 바꿔서 넣는다(__JITTER__). 난수로 하면 두 번이
  우연히 같은 값을 뽑아 테스트가 깜빡인다.
-->
<div style="height:__JITTER__px;background:#fa8"></div>
