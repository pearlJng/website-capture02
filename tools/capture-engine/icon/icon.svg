<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 웹사이트 스냅샷 앱 아이콘: 납작한 큰 도형 스타일. 파란 그라데이션 바탕에 위에서 남색 스트랩이 내려오고,
       남색 카메라가 아래로 잘려 나간다. 맥 앱 아이콘 격자(1024 캔버스 안 824 둥근 사각형) -->
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6E4FF"/><stop offset="1" stop-color="#4B5BF0"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E338A"/><stop offset="1" stop-color="#11133A"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E338A"/><stop offset="1" stop-color="#11133A"/></linearGradient>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <g filter="url(#tile)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)">
    <!-- 스트랩 (밝은 바탕 위라 남색) -->
    <path d="M 300 60 L 250 470" stroke="#2E338A" stroke-width="34" stroke-linecap="round" fill="none"/>
    <path d="M 724 60 L 774 470" stroke="#2E338A" stroke-width="34" stroke-linecap="round" fill="none"/>
    <!-- 몸통과 셔터 -->
    <rect x="640" y="372" width="130" height="80" rx="24" fill="#2E338A"/>
    <rect x="190" y="420" width="644" height="560" rx="96" fill="url(#body)"/>
    <!-- 렌즈: 흰 테 → 남색 유리 → 안쪽 고리 → 가운데 -->
    <circle cx="512" cy="700" r="226" fill="#FFFFFF"/>
    <circle cx="512" cy="700" r="176" fill="url(#glass)"/>
    <circle cx="512" cy="700" r="128" fill="none" stroke="#5B6BFF" stroke-width="12" stroke-opacity="0.6"/>
    <circle cx="512" cy="700" r="86" fill="#07081F"/>
    <!-- 반사 -->
    <ellipse cx="452" cy="636" rx="42" ry="26" transform="rotate(-38 452 636)" fill="#FFFFFF"/>
    <circle cx="566" cy="752" r="13" fill="#FFFFFF" opacity="0.8"/>
    <!-- 플래시 창 -->
    <rect x="262" y="488" width="96" height="56" rx="18" fill="#D6E4FF"/>
  </g>
</svg>
