<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 웹사이트 스냅샷 앱 아이콘: 납작한 큰 도형 스타일. 파란 그라데이션 바탕에 큰 렌즈가 오른쪽 아래로 잘려 나간다.
       맥 앱 아이콘 격자(1024 캔버스 안 824 둥근 사각형) -->
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6E4FF"/><stop offset="1" stop-color="#4B5BF0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E338A"/><stop offset="1" stop-color="#11133A"/></linearGradient>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <g filter="url(#tile)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)">
    <!-- 렌즈: 흰 테 → 유리 → 안쪽 고리 → 가운데 -->
    <circle cx="590" cy="615" r="345" fill="#FFFFFF"/>
    <circle cx="590" cy="615" r="275" fill="url(#glass)"/>
    <circle cx="590" cy="615" r="205" fill="none" stroke="#5B6BFF" stroke-width="14" stroke-opacity="0.55"/>
    <circle cx="590" cy="615" r="138" fill="#07081F"/>
    <!-- 반사 -->
    <ellipse cx="488" cy="512" rx="66" ry="40" transform="rotate(-38 488 512)" fill="#FFFFFF"/>
    <circle cx="678" cy="702" r="20" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
